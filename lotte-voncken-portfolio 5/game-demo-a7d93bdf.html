<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#efe6d2; --frame:#2b2a5c; --text:#2b2a5c; --btn:rgba(20,22,60,.28); --btnb:rgba(255,255,255,.55);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0c0e26; --frame:#3a3f86; --text:#e9dcc0; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0c0e26; --frame:#3a3f86; --text:#e9dcc0; color-scheme:dark; }
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:relative;line-height:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
canvas{display:block;background:#120f2e;
  border-radius:4px;box-shadow:0 0 0 4px var(--frame)}
#hint{font-size:10px;line-height:1.6;opacity:.8;text-align:center;padding:0 12px}
#touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:10px 12px;pointer-events:none}
#touch .grp{display:flex;gap:12px}
.tb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:var(--btn);border:2px solid var(--btnb);
  color:#fff;font:inherit;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.tb.on{background:rgba(255,204,61,.55)}
#mute{position:absolute;top:8px;right:8px;width:34px;height:34px;font-size:12px;display:none}
#rot{display:none;font-size:10px;line-height:1.7;text-align:center;padding:0 16px}
@media (orientation:portrait){body.touch #rot{display:block}}
body.touch #touch{display:flex} body.touch #mute{display:flex} body.touch #hint{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="360" aria-label="Dorus 30 platformgame"></canvas>
  <button class="tb" id="mute" aria-label="Geluid aan of uit">♪</button>
</div>
<div id="rot">Draai je telefoon voor het grootste scherm. Tik om te springen.</div>
<div id="hint">DORUS rent vanzelf &nbsp; spatie of klik = springen (ingedrukt = hoger) &nbsp; M geluid &nbsp; P pauze</div>
<script>
(()=>{
'use strict';
const W=640,H=360,TS=32,GROUND=288;
const cv=document.getElementById('game');const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const FONT="'Press Start 2P', ui-monospace, Menlo, monospace";
const HAND="'Caveat', 'Bradley Hand', 'Segoe Print', cursive";
const JP="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif";
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g];}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k;
function R(g,c,x,y,w,h){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function E(g,c,x,y,rx,ry,rot){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry||rx),rot||0,0,7);g.fill();}
function cap(g,c,x1,y1,x2,y2,r){g.strokeStyle=c;g.lineWidth=r*2;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function poly(g,c,pts){g.fillStyle=c;g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();g.fill();}
function rrect(g,c,x,y,w,h,r){g.fillStyle=c;g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h);g.fill();}

function crisp(c,outline,inner){const g=c.getContext('2d'),w=c.width,h=c.height,d=g.getImageData(0,0,w,h),a=d.data;
  const solid=new Uint8Array(w*h);for(let i=0;i<w*h;i++){solid[i]=a[i*4+3]>=110?1:0;a[i*4+3]=solid[i]?255:0;}
  if(outline){const o=hex(outline);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(solid[i])continue;
    if((x>0&&solid[i-1])||(x<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){a[i*4]=o[0];a[i*4+1]=o[1];a[i*4+2]=o[2];a[i*4+3]=255;}}}
  g.putImageData(d,0,0);return c;}
function hex(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function flip(c){const [o,g]=mk(c.width,c.height);g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return o;}
function silhouette(c,col){const [o,g]=mk(c.width,c.height);g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return o;}
function glow(g,x,y,r,col,a){g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a==null?1:a;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore();}


const OUT='#1c1220';
const PD={skin:'#f2c09a',skinS:'#d9946c',cap:'#2f66c8',capS:'#1f4590',capH:'#5a8ff0',hair:'#5a3520',beard:'#6b3f22',beardS:'#4f2c16',
  shirt:'#9aa7bc',shirtS:'#707c94',shirtH:'#c2ccdc',pack:'#a86a32',packS:'#7a4a20',jeans:'#36507e',jeansS:'#243659',boot:'#5a3a24',bootS:'#3a2414'};
const PL={skin:'#f7cba6',skinS:'#e0a07a',hair:'#e8c26a',hairS:'#c4953e',hairH:'#fbe6a8',tie:'#e8384e',top:'#fbf8f0',topS:'#d8d0c2',
  legs:'#3a3a62',legsS:'#272747',shoe:'#ffffff',shoeS:'#c8ccd8',blush:'#f39a9a',lip:'#d0606a'};
const PZ={fur:'#dca15a',furS:'#b07838',furH:'#f2c983',ear:'#b8783a',nose:'#2a1a12',tongue:'#f07a8c'};

function leg(g,hx,hy,th,bend,len,r,col,colS,shoe,shoeS,front){
  const kx=hx+Math.sin(th)*len,ky=hy+Math.cos(th)*len,sa=th-bend,fx=kx+Math.sin(sa)*len,fy=ky+Math.cos(sa)*len;
  cap(g,front?col:colS,hx,hy,kx,ky,r);cap(g,front?col:colS,kx,ky,fx,fy,r-.4);
  if(front)cap(g,colS,kx+1,ky,fx+1,fy,r-2.2);
  rrect(g,front?shoe:shoeS,fx-r,fy-r+1,r*2+5,r+2.5,2);R(g,shoeS,fx-r,fy+2.5,r*2+5,1.5);return [fx,fy];}
function arm(g,sx,sy,a,bend,len,r,sleeve,skin,skinS,front){
  const ex=sx+Math.sin(a)*len,ey=sy+Math.cos(a)*len,fa=a+bend,hx=ex+Math.sin(fa)*(len-1),hy=ey+Math.cos(fa)*(len-1);
  cap(g,front?skin:skinS,ex,ey,hx,hy,r-.6);E(g,front?skin:skinS,hx,hy,r+.3);cap(g,sleeve,sx,sy,sx+Math.sin(a)*len*.55,sy+Math.cos(a)*len*.55,r+.6);}


function drawDorus(g,o){const p=o.p,run=o.run,air=o.air||0,bob=run?-Math.abs(Math.cos(p))*2.2:Math.sin(o.breath||0)*.6;
  const hx=36,hy=50+bob,lean=.14*run+(air?.06:0);
  const legA=air?(air<0?[.9,1.4]:[.5,.5]):[.85*Math.sin(p)*run,(.25+1.1*Math.max(0,Math.cos(p)))*run+.05];
  const legB=air?(air<0?[-.5,.3]:[-.2,.4]):[.85*Math.sin(p+Math.PI)*run,(.25+1.1*Math.max(0,Math.cos(p+Math.PI)))*run+.05];
  const sx=hx+3+lean*14,sy=hy-17;
  const armA=air?[2.4,.4]:[-.95*Math.sin(p)*run+.15,1.35*run+.25],armB=air?[-.9,-.4]:[.95*Math.sin(p)*run+.15,1.35*run+.25];
  arm(g,sx-3,sy+2,armB[0],armB[1],10,3.2,PD.shirtS,PD.skin,PD.skinS,false);
  leg(g,hx-2,hy,legB[0],legB[1],11.5,4.2,PD.jeans,PD.jeansS,PD.boot,PD.bootS,false);

  rrect(g,PD.packS,hx-15+lean*8,sy-1,11,19,3);rrect(g,PD.pack,hx-14+lean*8,sy,9,16,3);R(g,PD.packS,hx-13+lean*8,sy+9,7,1);R(g,'#e8c070',hx-11+lean*8,sy+10,2,2);
  leg(g,hx+2,hy,legA[0],legA[1],11.5,4.2,PD.jeans,PD.jeansS,PD.boot,PD.bootS,true);

  g.save();g.translate(hx,hy);g.rotate(lean);rrect(g,PD.shirtS,-8,-20,17,22,5);rrect(g,PD.shirt,-7,-20,14,20,5);R(g,PD.shirtH,-5,-18,4,10);
  R(g,PD.jeansS,-8,-1,17,4);R(g,'#2a1a14',-1,-1,3,3);cap(g,PD.packS,-6,-19,3,-3,1.3);g.restore();

  const cx=hx+4+lean*20,cy=sy-9;
  E(g,PD.skinS,cx-1,cy+1,10,10.5);E(g,PD.skin,cx,cy,9.5,10);
  E(g,PD.beardS,cx+1,cy+5,9.5,6.5);E(g,PD.beard,cx+2,cy+4.5,8.5,5.6);E(g,PD.skin,cx+3,cy+1.4,7,3.2);
  R(g,'#9a4a3a',cx+4,cy+6,4,1.5);R(g,PD.skin,cx+8,cy,3,3);
  R(g,'#1a100c',cx+5,cy-3,2,3);R(g,'#ffffff',cx+5,cy-3,1,1);R(g,PD.hair,cx+3,cy-6,6,1.5);
  E(g,PD.skinS,cx-5,cy+.5,2.2,3);E(g,PD.hair,cx-8,cy-1,3,5);

  g.save();g.beginPath();g.rect(cx-14,cy-16,30,11.5);g.clip();E(g,PD.capS,cx-.5,cy-3,10.8,10.5);E(g,PD.cap,cx,cy-4,10,9.5);E(g,PD.capH,cx-2,cy-9,4.5,2.2);g.restore();
  rrect(g,PD.capS,cx+3,cy-6.5,12,3.4,1.5);R(g,PD.cap,cx+4,cy-6.4,10,1.4);E(g,'#ffffff',cx+1,cy-9,1.6);
  arm(g,sx,sy+2,armA[0],armA[1],10,3.2,PD.shirt,PD.skin,PD.skinS,true);
}
function drawLotte(g,o){const p=o.p,run=o.run,air=o.air||0,bob=run?-Math.abs(Math.cos(p))*2:Math.sin(o.breath||0)*.6;
  const hx=36,hy=52+bob,lean=.12*run+(air?.05:0);
  const legA=air?(air<0?[.9,1.4]:[.5,.5]):[.8*Math.sin(p)*run,(.25+1.05*Math.max(0,Math.cos(p)))*run+.05];
  const legB=air?(air<0?[-.5,.3]:[-.2,.4]):[.8*Math.sin(p+Math.PI)*run,(.25+1.05*Math.max(0,Math.cos(p+Math.PI)))*run+.05];
  const sx=hx+2+lean*12,sy=hy-16;
  const armA=air?[2.5,.3]:[-.95*Math.sin(p)*run+.12,1.3*run+.25],armB=air?[-1,-.3]:[.95*Math.sin(p)*run+.12,1.3*run+.25];

  const cx=hx+3+lean*18,cy=sy-9,sw=run?Math.sin(p*2-1)*.35:Math.sin(o.breath||0)*.08,pa=-1.0+sw-(air<0?.5:air>0?-.4:0);
  const th=(run?1.05:.35)+sw-(air<0?-.5:air>0?.6:0);for(let i=0;i<6;i++){const t2=th+i*.12,d=i*2.8;E(g,i%2?PL.hairS:PL.hair,cx-7-Math.sin(t2)*d,cy-5+Math.cos(t2)*d,4.4-i*.45,4.2-i*.4);}
  arm(g,sx-3,sy+2,armB[0],armB[1],9.5,2.9,PL.topS,PL.skin,PL.skinS,false);
  leg(g,hx-2,hy,legB[0],legB[1],11,3.6,PL.legs,PL.legsS,PL.shoe,PL.shoeS,false);
  leg(g,hx+2,hy,legA[0],legA[1],11,3.6,PL.legs,PL.legsS,PL.shoe,PL.shoeS,true);
  g.save();g.translate(hx,hy);g.rotate(lean);rrect(g,PL.topS,-7,-19,15,21,5);rrect(g,PL.top,-6,-19,12,19,5);R(g,'#ffffff',-4,-17,3,8);R(g,PL.legsS,-7,0,15,2);g.restore();
  E(g,PL.skinS,cx-1,cy+1,9.6,10);E(g,PL.skin,cx,cy,9.2,9.6);
  E(g,PL.blush,cx+5,cy+3,2,1.2);R(g,'#1a100c',cx+4,cy-1,2,3);R(g,'#ffffff',cx+4,cy-1,1,1);R(g,'#1a100c',cx+5,cy-2,2,1);R(g,PL.lip,cx+5,cy+5,3,1.3);R(g,PL.skin,cx+8,cy+1,2,2);

  g.save();g.beginPath();g.rect(cx-14,cy-16,30,12.5);g.clip();E(g,PL.hairS,cx-.5,cy-1.5,10.5,10.5);E(g,PL.hair,cx,cy-2.5,9.8,9.8);E(g,PL.hairH,cx-1,cy-8,5,2);g.restore();
  E(g,PL.hair,cx-6,cy+1,4.2,7);E(g,PL.hairS,cx-7,cy+4,3,4);E(g,PL.hair,cx+5,cy-4.5,4.8,2.4,-.3);
  E(g,PL.tie,cx-8,cy-4,1.8,2.2);
  arm(g,sx,sy+2,armA[0],armA[1],9.5,2.9,PL.top,PL.skin,PL.skinS,true);
}
function drawDorusFront(g,o){}
function drawZazoe(g,o){const p=o.p,run=o.run,air=o.air||0,sit=o.sit||0,wag=o.wag||0;
  const by=sit?34:31-(run?Math.abs(Math.sin(p))*2.4:0)-(air<0?3:0),bx=30;
  const fl=(ph,a)=>air?(air<0?a*.9:-a*.4):Math.sin(ph)*.75*run;
  const legs=sit?[[22,40,.0],[27,40,.0],[38,38,-.05],[42,38,-.05]]:[[19,by+5,fl(p+.4,-1)],[24,by+5,fl(p,-1)],[38,by+5,fl(p+Math.PI,1)],[43,by+5,fl(p+Math.PI+.4,1)]];
  const legCol=(i)=>i%2?PZ.furS:PZ.fur;
  legs.forEach(([x,y,a],i)=>{if(i%2)return;const ex=x+Math.sin(a)*10,ey=y+Math.cos(a)*10;cap(g,PZ.furS,x,y,ex,ey,3.2);E(g,PZ.furS,ex+1,ey,3.6,2.5);});

  const ta=sit?(-1.3+Math.sin(wag)*.6):(-.9+Math.sin(p*2)*.4*run);
  const tx=sit?17:14,ty=sit?40:by-3;for(let i=0;i<4;i++){E(g,i%2?PZ.fur:PZ.furH,tx+Math.cos(Math.PI+ta)*i*3.2,ty+Math.sin(Math.PI+ta)*i*3.2,3.2-i*.3);}

  if(sit){E(g,PZ.furS,29,36,11,9);E(g,PZ.fur,30,34,10,8.5);E(g,PZ.furS,37,30,8,10,.4);E(g,PZ.fur,38,29,7,9,.4);}
  else{E(g,PZ.furS,bx,by+1,16,9.5);E(g,PZ.fur,bx,by,15.5,8.5);}
  const r=rng(5);const cx0=sit?33:bx,cy0=sit?32:by;for(let i=0;i<34;i++){const a=r()*6.28,d=r();E(g,r()<.5?PZ.furH:PZ.furS,cx0+Math.cos(a)*d*(sit?9:13),cy0+Math.sin(a)*d*(sit?8:6.5)-1,1.6,1.4);}
  legs.forEach(([x,y,a],i)=>{if(!(i%2))return;const ex=x+Math.sin(a)*10,ey=y+Math.cos(a)*10;cap(g,PZ.fur,x,y,ex,ey,3.4);E(g,PZ.furH,ex+1.5,ey+.5,3.8,2.6);E(g,PZ.fur,x,y-1,4,3);});

  const hx=sit?44:47,hy=sit?17:by-10+(run?Math.sin(p)*1:0);
  E(g,PZ.furS,hx,hy+1,9.5,9);E(g,PZ.fur,hx,hy,9,8.5);for(let i=0;i<10;i++){const a=-2.6+i*.32;E(g,i%2?PZ.furH:PZ.fur,hx+Math.cos(a)*8,hy+Math.sin(a)*7.5,2.4);}
  E(g,PZ.furH,hx+8,hy+3.5,5.5,4);E(g,PZ.nose,hx+12.5,hy+2,2.4,1.8);
  if(run||sit){E(g,PZ.tongue,hx+9,hy+8,1.8,2.6);}
  R(g,'#1a100c',hx+3,hy-2,2.5,2.5);R(g,'#ffffff',hx+3,hy-2,1,1);
  const ea=run?Math.sin(p+1)*.35:0;g.save();g.translate(hx-4,hy-3);g.rotate(.25+ea);E(g,PZ.ear,0,7,4,7.5);for(let i=0;i<4;i++)E(g,PZ.furS,-1+(i%2)*2,2+i*3,2,1.6);g.restore();
}


function frames(fn,w,h,poses){return poses.map(o=>{const [c,g]=mk(w,h);fn(g,o);crisp(c,OUT);return {r:c,l:flip(c)};});}
const RUNF=16;
const CH={};
function buildChars(){
  const run=[],idle=[];for(let i=0;i<RUNF;i++)run.push({p:i/RUNF*Math.PI*2,run:1});for(let i=0;i<4;i++)idle.push({p:0,run:0,breath:i/4*6.28});
  const up=[{p:0,run:0,air:-1}],down=[{p:0,run:0,air:1}];
  for(const [k,fn] of [['dorus',drawDorus],['lotte',drawLotte]])CH[k]={run:frames(fn,72,76,run),idle:frames(fn,72,76,idle),up:frames(fn,72,76,up)[0],down:frames(fn,72,76,down)[0],feet:[36,74]};
  const zr=[],zs=[];for(let i=0;i<RUNF;i++)zr.push({p:i/RUNF*Math.PI*2,run:1});for(let i=0;i<6;i++)zs.push({sit:1,wag:i/6*6.28});
  CH.zazoe={run:frames(drawZazoe,64,52,zr),sit:frames(drawZazoe,64,52,zs),up:frames(drawZazoe,64,52,[{p:0,run:0,air:-1}])[0],down:frames(drawZazoe,64,52,[{p:0,run:0,air:1}])[0],
    stand:frames(drawZazoe,64,52,[{p:0,run:.15}])[0],feet:[32,48]};
}


const G0=288;
function sky(g,stops){const gr=g.createLinearGradient(0,0,0,H);stops.forEach(([p,c])=>gr.addColorStop(p,c));g.fillStyle=gr;g.fillRect(0,0,W,H);}
function vgrad(g,x,y,w,h,c0,c1){const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c0);gr.addColorStop(1,c1);g.fillStyle=gr;g.fillRect(x,y,w,h);}
function cloud(g,x,y,s,c,cs){E(g,cs,x+s*.1,y+s*.18,s*1.05,s*.32);E(g,c,x,y,s,s*.3);E(g,c,x-s*.35,y+s*.02,s*.45,s*.26);E(g,c,x+s*.1,y-s*.16,s*.5,s*.3);E(g,c,x+s*.5,y-s*.04,s*.42,s*.26);}
function stars(g,r,n,y1){for(let i=0;i<n;i++){const x=r()*W,y=r()*y1,b=r();R(g,b<.15?'#fff6c8':'#ffffff',x,y,b<.1?2:1,b<.1?2:1);}}

    if(e.st==='warn'&&Math.floor(t/5)%2)txt('!',x+iw/2,e.y-34,24,'#ff4a4a','center');else if(e.honk>0&&e.st==='go')txt('TOET!',x+iw/2,e.y-22,8,'#fff','center');}
  const [L,Z]=game.comps,P=game.P;

  drawChar('zazoe',Z,Z.x,Z.y,Z.moving,Z.air,Z.vy);drawChar('lotte',L,L.x,L.y,L.moving,L.air,L.vy);
  const mv=Math.abs(P.vx)>.3||(game.state==='goal'&&P.vx!==0);drawChar('dorus',null,P.x,P.y,mv,!P.onGround,P.vy,P.inv>0&&Math.floor(P.inv/4)%2===0,P.land);
  for(const p of game.parts)R(ctx,p.c,p.x-cam,p.y,p.conf?3:3,p.conf?4:3);
  if(w.snow)snowfall2(t,vw);

function coinSpin(x,y,k){const s=Math.max(.15,k);glow(ctx,x,y,18,'rgba(255,210,80,.9)',.28);E(ctx,'#5a3200',x,y,8*s+1,10);E(ctx,'#e09a10',x,y,7*s+.5,9);E(ctx,'#ffd23a',x-.8*s,y-.6,5.5*s,8);if(s>.4){R(ctx,'#fff6c0',x-3*s,y-5,1.6,7);}}
function snowfall2(t,vw){for(let i=0;i<60;i++){const sp=.6+(i%4)*.3,x=((i*97+t*sp*.6+Math.sin(t/40+i)*10)%vw+vw)%vw,y=((i*53+t*sp*1.4)%H+H)%H;R(ctx,'#ffffff',x,y,i%3?2:3,i%3?2:3);}}

let MAPC=null;function mapCanvas(){if(!MAPC){const [c,g]=mk(W,H);mapBase(g);MAPC=c;}return MAPC;}
function pinXY(i){const w=WORLDS[i];return [MAPX(w.lon),MAPY(w.lat)];}
function routeCtl(a,b){return [(a[0]+b[0])/2,Math.min(a[1],b[1])-Math.abs(a[0]-b[0])*.18-14];}
function drawMapHub(target,from,t,unlock){ctx.drawImage(mapCanvas(),0,0);const n=Math.max(target+1,SAVE.done+1),showN=Math.min(WORLDS.length,Math.max(n,PUBLIC));
  ctx.setLineDash([3,3]);ctx.lineWidth=1.5;for(let i=1;i<showN;i++){if(i>=PUBLIC&&!(unlock||SAVE.x))break;const a=pinXY(i-1),b=pinXY(i),c=routeCtl(a,b);ctx.strokeStyle=i<=Math.max(target,SAVE.done)?'rgba(255,255,255,.95)':'rgba(255,255,255,.3)';ctx.beginPath();ctx.moveTo(a[0],a[1]-8);ctx.quadraticCurveTo(c[0],c[1],b[0],b[1]-8);ctx.stroke();}ctx.setLineDash([]);
  for(let i=0;i<showN;i++){if(i>=PUBLIC&&!(unlock||SAVE.x))break;const [x,y]=pinXY(i);const done=i<SAVE.done&&i!==target,cur=i===target;
    if(i===PUBLIC&&unlock){const k=clamp((t-30)/30,0,1);glow(ctx,x,y-16,40*k+Math.sin(t/6)*4,'rgba(255,220,120,.95)',.6*k);if(k<1)continue;}
    pin(ctx,x,y,i+1,cur?(Math.floor(t/15)%2?'#ff5a7a':'#e8323a'):done?'#d8a020':'#6a6a8a');}

  const fly=clamp((t-(unlock?60:10))/110,0,1),e=fly*fly*(3-2*fly);let px,py,ang=0;
  const b=pinXY(target);if(from>=0){const a=pinXY(from),c=routeCtl(a,b);const q=(k)=>[(1-k)*(1-k)*a[0]+2*(1-k)*k*c[0]+k*k*b[0],(1-k)*(1-k)*(a[1]-8)+2*(1-k)*k*c[1]+k*k*(b[1]-8)];
    [px,py]=q(e);const [qx,qy]=q(Math.min(1,e+.02));ang=Math.atan2(qy-py,qx-px);}else{px=b[0];py=b[1]-8-(1-e)*40;ang=Math.PI/2;}
  ctx.save();ctx.translate(px,py-10);ctx.rotate(ang);poly(ctx,'#1c1220',[-13,0,13,0,15,-3,-11,-3]);poly(ctx,'#ffffff',[-12,-.5,12,-.5,14,-2.5,-10,-2.5]);poly(ctx,'#ffffff',[-3,-1,5,-1,-5,-12]);poly(ctx,'#ffffff',[-3,-1,5,-1,-5,10]);poly(ctx,'#ffffff',[-12,-1,-8,-1,-13,-7]);ctx.restore();
  if(fly>=1){const [x,y]=b;ctx.drawImage(CH.zazoe.sit[Math.floor(t/8)%6].r,0,0,64,52,x-48,y-20,30,24);ctx.drawImage(CH.lotte.idle[0].r,0,0,72,76,x-36,y-34,34,36);ctx.drawImage(CH.dorus.idle[0].r,0,0,72,76,x-20,y-34,34,36);}}
function drawMap(){const w=WORLDS[game.wi],t=game.t;drawMapHub(game.wi,game.from,t,false);
  panel(W/2-170,8,340,52);txt('HOOFDSTUK '+w.num,W/2,20,8,'#ffd8a8','center');txt(w.name,W/2,34,16,'#ffd23a','center');
  if(t>130&&Math.floor(t/30)%2===0){panel(W/2-110,316,220,32);txt(hint()+' = VERDER',W/2,328,8,'#fff','center');}}

  vgrad(g,0,0,W,H,'#3a2418','#1e120c');for(let y=0;y<H;y+=6)R(g,'rgba(255,200,150,.04)',0,y,W,2);
  rrect(g,'rgba(0,0,0,.4)',46,26,556,300,8);rrect(g,'#f4ead4',40,20,280,296,6);rrect(g,'#f8f0dc',320,20,280,296,6);R(g,'#d8c8a8',318,20,4,296);for(let y=60;y<290;y+=18)R(g,'#d8d0f0',340,y,240,1);
  g.save();g.translate(176,132);g.rotate(-.05+((w.num%3)-1)*.03);R(g,'rgba(0,0,0,.25)',-104,-92,214,200);R(g,'#ffffff',-108,-96,216,196);const th=THUMBS[w.bd[0]];if(th)g.drawImage(th,0,0,W,H,-100,-88,200,112);
  g.fillStyle='#3a3a5a';g.font='24px '+HAND;g.textAlign='center';g.textBaseline='alphabetic';g.fillText(w.caption,0,58);R(g,'rgba(255,240,170,.75)',-30,-104,60,18);g.restore();
  g.save();g.translate(248,250);g.rotate(.16);g.strokeStyle='rgba(40,90,170,.8)';g.lineWidth=2.5;g.strokeRect(-48,-18,96,36);g.strokeRect(-43,-13,86,26);g.fillStyle='rgba(40,90,170,.85)';g.font='7px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText(w.stamp,0,0);g.restore();
  if(game.wi>0){const p=WORLDS[game.wi-1];g.strokeStyle='#8a6a4a';g.setLineDash([4,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(66,282);g.bezierCurveTo(100,256,140,296,176,270);g.stroke();g.setLineDash([]);E(g,'#e8323a',66,282,4);E(g,'#2b6fd6',176,270,4);
    g.fillStyle='#3a3a5a';g.font='6px '+FONT;g.textAlign='center';g.textBaseline='top';g.fillText(p.name,66,290);g.fillText(w.name,176,278);}
  g.fillStyle='#8a5a3a';g.font='9px '+FONT;g.textAlign='left';g.textBaseline='top';g.fillText('HOOFDSTUK '+w.num,344,36);g.fillStyle='#2a2a4a';g.font='38px '+HAND;g.fillText(w.name.charAt(0)+w.name.slice(1).toLowerCase(),344,50);
  g.font='21px '+HAND;g.fillStyle='#3a3a5a';w.text.forEach((l,i)=>g.fillText(l,344,100+i*19));
  g.fillStyle='#c8323a';g.font='7px '+FONT;wrap(w.tip,30).forEach((l,i)=>g.fillText(l,344,190+i*12));

  const [who,line]=w.talk[game.line];rrect(g,'rgba(20,14,40,.94)',36,292,568,60,10);
  const set=who==='DORUS'?CH.dorus.idle[0]:who==='LOTTE'?CH.lotte.idle[0]:CH.zazoe.sit[1],col=who==='DORUS'?'#8ac8ff':who==='LOTTE'?'#ffd23a':'#ffb07a';
  g.save();g.beginPath();g.arc(70,322,22,0,7);g.fillStyle='#f4ead4';g.fill();g.clip();if(who==='ZAZOE')g.drawImage(set.r,24,0,40,30,44,300,60,45);else g.drawImage(set.r,14,0,44,40,40,298,60,54);g.restore();
  g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.arc(70,322,22,0,7);g.stroke();
  txt(who,104,302,8,col,'left',false);const shown=line.slice(0,Math.max(0,(t-20)*1.5|0));wrap(shown,52).slice(0,2).forEach((l,i)=>txt(l,104,318+i*13,8,'#ffffff','left',false));
  if(t>40&&Math.floor(t/25)%2===0)txt(game.line<w.talk.length-1?'>':hint()+' = START',592,338,8,'#ffd23a','right',false);
  vignette(g,.3);}


function drawTitle(){const t=game.t;ctx.drawImage(mapCanvas(),0,0);ctx.fillStyle='rgba(16,10,36,.55)';ctx.fillRect(0,0,W,H);
  vgrad(ctx,0,250,W,110,'rgba(0,0,0,0)','rgba(10,6,24,.8)');R(ctx,'#e8d6a8',0,300,W,4);R(ctx,'#c8b080',0,304,W,56);for(let x=-(t*3%32);x<W;x+=32)R(ctx,'#a8905a',x,304,2,56);

function drawOpening(){ctx.drawImage(BDC.sOpening||backdrop('sOpening'),0,0);ctx.fillStyle='rgba(10,6,20,.35)';ctx.fillRect(0,0,W,H);

function starsFor(c,tot){return c>=tot*.8?3:c>=tot*.5?2:1;}
function bigStar(x,y,on){const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?9:20;pts.push(x+Math.cos(a)*r,y+Math.sin(a)*r);}poly(ctx,'#1c1220',pts.map((v,i)=>v+(i%2?2:0)));poly(ctx,on?'#ffd23a':'#4a4a6a',pts);if(on)glow(ctx,x,y,30,'rgba(255,210,80,.9)',.4);}

  bigTxt(w.name,W/2,40,32,'#ffcc33','#3a1030');txt('VOLTOOID!',W/2,94,12,'#ffffff','center');const s=starsFor(game.coins,tot);for(let i=0;i<3;i++)bigStar(W/2-60+i*60,150,i<s&&game.t>20+i*12);
  txt('MUNTEN '+game.coins+'/'+tot,W/2,190,8,'#fff','center');txt('EINDE VAN DE DEMO',W/2,220,8,'#ffd8a8','center');txt('KLIK OM OPNIEUW TE SPELEN',W/2,240,8,'#ffd23a','center');
  if(game.t>40&&Math.floor(game.t/30)%2===0)txt(hint()+' = VERDER',W/2,290,8,'#fff','center');}
function totalCoins(){let s=0;for(let i=1;i<=PUBLIC;i++)s+=SAVE.coins[i]||0;return s;}
function drawAllClear(){drawWorld();ctx.fillStyle='rgba(16,10,36,.74)';ctx.fillRect(0,0,W,H);bigTxt('GEFELICITEERD!',W/2,40,32,'#ffcc33','#3a1030');
  txt('ALLE 12 AVONTUREN UITGESPEELD!',W/2,100,12,'#ffffff','center');txt('TOTAAL MUNTEN: '+totalCoins(),W/2,140,8,'#ffd23a','center');bigTxt('THE END',W/2,180,24,'#fff','#c8323a');
  if(game.t>150&&Math.floor(game.t/30)%2===0)txt(hint()+' = AFSLUITEN',W/2,290,8,'#b8b0d8','center');}
function typed(s,t0,sp){return s.slice(0,Math.max(0,Math.floor((game.t-t0)/(sp||3))));}

  if(gl)for(let i=0;i<8;i++)R(ctx,['#ff4fd0','#2bf0ff','#ffffff'][i%3],0,Math.random()*H,W,1+Math.random()*4);
  if(t>40)bigTxt(typed('WAIT...',40,8),W/2,110,40,'#ffffff','#c8323a');if(t>110)txt(typed("THERE'S ONE MORE ADVENTURE.",110,3),W/2,190,12,'#ffd23a','center');
  if(t>190&&Math.floor(t/30)%2===0)txt(hint()+'...',W/2,290,8,'#b8b0d8','center');}
function drawUnlock(){const t=game.t,S=SEC||unseal();drawMapHub(PUBLIC,PUBLIC-1,t,true);panel(W/2-190,8,380,64,.9);
  txt('NIEUWE BESTEMMING ONTGRENDELD!',W/2,20,8,'#ffd8a8','center');if(t>150)txt(typed(S.world.name+': '+S.world.sub,150,3),W/2,40,12,'#ffd23a','center');

function drawFinalOverlay(){const g=game.goalT,S=SEC||unseal();if(g<260)return;const a=Math.min(1,(g-260)/30);rrect(ctx,'rgba(20,10,40,'+(.66*a)+')',20,10,W-40,170,10);
  let y=24;S.msgs.forEach(([s,size,col],i)=>{const t0=290+i*100;if(g<t0)return;const str=s.slice(0,Math.floor((g-t0)/2));const sz=size*1.5;
    if(sz>12)bigTxt(str,W/2,y,sz,col,'#3a1030');else txt(str,W/2,y,sz,col,'center');y+=sz+(sz>12?14:12);});
  if(g>860&&Math.floor(g/30)%2===0)txt(hint()+' = TERUG NAAR HET BEGIN',W/2,340,8,'#ffffff','center');}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;const st=game.state;
  if(st==='title')return drawTitle();if(st==='opening')return drawOpening();if(st==='map')return drawMap();if(st==='journal')return drawJournal();
  if(st==='complete')return drawComplete();if(st==='allclear')return drawAllClear();if(st==='twist')return drawTwist();if(st==='unlock')return drawUnlock();
  drawWorld();if(st==='goal'&&WORLDS[game.wi].num===13){drawFinalOverlay();return;}drawHUD();
  if(st==='respawn'){ctx.fillStyle='rgba(16,10,36,'+(game.fade>40?0:1-Math.abs(game.fade-20)/20)+')';ctx.fillRect(0,0,W,H);}
  if(st==='play'&&game.runDelay>20&&Math.floor(game.t/15)%2)txt('KLAAR?',W/2,150,12,'#fff','center');
  if(game.paused){ctx.fillStyle='rgba(16,10,36,.7)';ctx.fillRect(0,0,W,H);bigTxt('PAUZE',W/2,150,24,'#fff','#c8323a');txt('P = VERDER',W/2,200,8,'#ffd8a8','center');}}


let acc=0,last=0;
function frame(ts){const dt=Math.min(100,ts-(last||ts));last=ts;acc+=dt;while(acc>=1000/60){tick();acc-=1000/60;}render();requestAnimationFrame(frame);}

function BOOT(){buildChars();buildObs();buildObs2();mapCanvas();thumb('sAngkor');thumb('sTokyo');backdrop('sOpening');addEventListener('resize',fit);fit();
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.state==='play'&&!game.paused)game.togglePause();});requestAnimationFrame(frame);}
const FL=document.fonts;Promise.race([Promise.all(FL&&FL.load?['16px "Press Start 2P"','24px "Caveat"'].map(f=>FL.load(f).catch(()=>{})):[]),new Promise(r=>setTimeout(r,2500))]).then(()=>{BOOT();startLevel(0);});
window.__dorus={BOOT,game,input,tick,render,startLevel,WORLDS,unseal,SAVE,buildLevel,goMap,goJournal,thumb,backdrop};

})();
