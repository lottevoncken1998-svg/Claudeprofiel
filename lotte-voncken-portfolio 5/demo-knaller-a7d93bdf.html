<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Knaller demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--kaart:#FFFFFF;--rand:#E4E0D6;--tekst:#1B1A2E;--zacht:#6B6880;--accent:#5B3FD9;--groen:#1F9D63}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tekst);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;flex-wrap:wrap}
.merk{font-family:'Space Grotesk';font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px}
.merk i{width:12px;height:12px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.tag{font-size:12px;color:var(--zacht);border:1px solid var(--rand);padding:6px 12px;border-radius:999px;background:#fff}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr);gap:32px;padding:8px 28px 32px;max-width:1360px;margin:0 auto;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr;padding:8px 16px 24px}.top{padding:14px 16px}}
.podium{background:repeating-linear-gradient(45deg,#EFECE4 0 12px,#F3F0E9 12px 24px);border:1px solid var(--rand);border-radius:24px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.passe{position:relative;flex:none}
.ad{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;border-radius:6px;box-shadow:0 30px 60px rgba(27,26,46,.25);font-family:Poppins,sans-serif}
.onder{font-size:13px;color:var(--zacht);text-align:center}

/* de advertentie (interne maat 1080 breed) */
.foto{position:absolute;left:0;top:0;width:1080px;background-size:cover;background-repeat:no-repeat}
.laag{position:absolute;left:0;top:0;width:1080px;transform:translateY(100%);transition:transform .8s cubic-bezier(.2,.9,.25,1)}
.blok{position:absolute;color:#fff}
.pill{display:inline-block;font-weight:700;font-size:30px;padding:10px 28px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.sticker{position:absolute;transform:rotate(-5deg) scale(0);transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.sticker span{display:inline-block;background:#fff;color:#161616;font-weight:800;font-size:31px;padding:12px 30px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
h1.kop{font-weight:800;font-size:76px;line-height:1.1;letter-spacing:-.01em;margin-top:26px}
h1.kop span{display:inline-block;opacity:0;transform:translateY(24px);transition:opacity .4s,transform .5s cubic-bezier(.2,1.3,.4,1)}
.lijn{height:8px;width:0;border-radius:4px;margin:26px 0 24px;transition:width .6s ease}
.desc{font-size:33px;line-height:1.38;max-width:880px;opacity:0;transition:opacity .6s}
.chip{display:flex;align-items:center;gap:14px;width:fit-content;background:#fff;color:#161616;font-weight:700;font-size:30px;padding:10px 26px 10px 12px;border-radius:999px;margin-bottom:12px;opacity:0;transform:translateX(-20px);transition:opacity .4s,transform .4s}
.chip svg{width:40px;height:40px;flex:none}
.cta{display:inline-flex;align-items:center;gap:16px;font-weight:700;font-size:34px;padding:20px 40px;border-radius:999px;margin-top:30px;box-shadow:0 10px 24px rgba(0,0,0,.2);transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.cta svg{width:30px;height:30px}
.logo{position:absolute;background:#fff;border-radius:18px;padding:14px 22px;box-shadow:0 6px 18px rgba(0,0,0,.15);transform:translateY(-160px);transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.logo svg{display:block;height:46px;width:auto}
.ad.aan .laag{transform:none}
.ad.aan .pill,.ad.aan .cta{transform:scale(1)}
.ad.aan .sticker{transform:rotate(-5deg) scale(1)}
.ad.aan h1.kop span{opacity:1;transform:none}
.ad.aan .lijn{width:120px}
.ad.aan .desc{opacity:1}
.ad.aan .chip{opacity:1;transform:none}
.ad.aan .logo{transform:none}
.veilig{position:absolute;border:4px dashed #22D3EE;pointer-events:none;opacity:0;transition:opacity .3s}
.gezicht{position:absolute;border:4px dashed #FFD166;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s}
.ad.toon-vlak .veilig,.ad.toon-vlak .gezicht{opacity:1}
.label-origineel{position:absolute;left:30px;bottom:30px;background:rgba(0,0,0,.55);color:#fff;font-family:Inter;font-weight:600;font-size:28px;padding:10px 22px;border-radius:999px;transition:opacity .3s}
.ad.aan .label-origineel{opacity:0}

/* bediening */
.zij{display:flex;flex-direction:column;gap:16px;min-width:0}
.groot{width:100%;border:0;border-radius:16px;padding:18px 22px;background:var(--tekst);color:#fff;font-weight:700;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 #000;transition:transform .1s,box-shadow .1s}
.groot:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
.groot svg{width:20px;height:20px}
.blokje{background:var(--kaart);border:1px solid var(--rand);border-radius:16px;padding:16px 18px}
.blokje h3{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin-bottom:10px;color:var(--zacht);text-transform:uppercase;letter-spacing:.04em}
.kleuren{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kleur{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--rand);cursor:pointer}
.kleur.aan{box-shadow:0 0 0 3px var(--tekst)}
.eigen{position:relative;width:38px;height:38px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);box-shadow:0 0 0 1px var(--rand);overflow:hidden}
.eigen input{position:absolute;inset:-10px;opacity:0;cursor:pointer}
.keuzes{display:flex;gap:8px;flex-wrap:wrap}
.keuze{border:1px solid var(--rand);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;cursor:pointer}
.keuze.aan{background:var(--tekst);color:#fff;border-color:var(--tekst)}
.upload{display:flex;gap:8px;flex-wrap:wrap}
.upload label{border:1.5px dashed var(--rand);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.upload label svg{width:18px;height:18px}
.upload input{display:none}
.klein{font-size:12px;color:var(--zacht);margin-top:8px;line-height:1.5}
.schakel{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.schakel input{width:18px;height:18px;accent-color:var(--tekst)}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--zacht);transition:color .3s}
.check i{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--rand);display:grid;place-items:center;flex:none;transition:all .3s}
.check i svg{width:13px;height:13px;opacity:0}
.check.ok{color:var(--tekst)}.check.ok i{background:var(--groen);border-color:var(--groen)}.check.ok i svg{opacity:1}
.check.fout{color:#C2410C}.check.fout i{background:#F97316;border-color:#F97316}
.check.grijs{color:var(--zacht)}
.uitslag{font-family:'Space Grotesk';font-weight:700;font-size:18px;margin-top:6px;min-height:24px}
</style>
</head>
<body>
<div class="top">
  <div class="merk"><i></i>Claude Knaller</div>
  <div class="tag">Live demo · echte foto, opmaak als laagjes erover</div>
</div>
<main>
  <section class="podium">
    <div class="passe" id="passe"><div class="ad" id="ad"></div></div>
    <p class="onder" id="onder">Dit is de foto zoals hij binnenkomt. Klik op de knop en kijk wat er gebeurt.</p>
  </section>

  <aside class="zij">
    <button class="groot" id="maak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.8L20 10l-5 3.8L16.6 20 12 16.5 7.4 20 9 13.8 4 10l6.1-1.2z"/></svg><span>Maak er een advertentie van</span></button>

    <div class="blokje"><h3>Huiskleur</h3><div class="kleuren" id="kleuren"></div></div>
    <div class="blokje"><h3>Onderwerp</h3><div class="keuzes" id="onderwerpen"></div></div>
    <div class="blokje"><h3>Stijl en formaat</h3>
      <div class="keuzes" id="stijlen" style="margin-bottom:8px"></div>
      <div class="keuzes" id="formaten"></div>
    </div>
    <div class="blokje"><h3>Foto</h3>
      <div class="upload">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Kies je eigen foto<input type="file" id="bestand" accept="image/*"></label>
        <button class="keuze" id="voorbeeld" type="button">Voorbeeldfoto</button>
      </div>
      <p class="klein">Je foto blijft op je eigen computer. Er wordt niets geüpload.</p>
    </div>
    <div class="blokje"><h3>Controle, net als de skill</h3>
      <div class="checks" id="checks"></div>
      <div class="uitslag" id="uitslag"></div>
      <label class="schakel" style="margin-top:10px"><input type="checkbox" id="vlak">Laat het veilige vlak en het gezicht zien</label>
    </div>
  </aside>
</main>

<script>
const $ = s=>document.querySelector(s);
const VINK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
const PIJL = c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>`;
const CHIPV = c=>`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="${c}"/><path d="m12 20.5 5.5 5.5L28 15" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOGO = c=>`<svg viewBox="0 0 230 60"><g transform="translate(30 30)" fill="${c}"><circle r="12"/>${[0,45,90,135,180,225,270,315].map(a=>`<rect x="-2.5" y="-25" width="5" height="8" rx="2.5" transform="rotate(${a})"/>`).join('')}</g><text x="66" y="44" font-family="Poppins" font-weight="800" font-size="40" fill="#1B1A2E">lumo</text></svg>`;

/* getekende voorbeeldfoto (1200 x 1200), hoofd op 600,470 */
const SCENE = 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
<defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4DCC8"/><stop offset="1" stop-color="#EBC9AE"/></linearGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFEFFF"/><stop offset="1" stop-color="#9ED8F5"/></linearGradient>
<radialGradient id="l" cx=".75" cy=".25" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="1200" fill="url(#m)"/>
<rect x="0" y="930" width="1200" height="270" fill="#D9B596"/>
<rect x="800" y="150" width="300" height="430" rx="10" fill="#fff"/><rect x="818" y="168" width="264" height="394" fill="url(#r)"/>
<path d="M950 168v394M818 365h264" stroke="#fff" stroke-width="14"/>
<path d="M830 520c40-40 80-30 120-60s80-20 132-50v152H830z" fill="#8ACB9A" opacity=".7"/>
<rect x="90" y="250" width="220" height="150" rx="8" fill="#fff" opacity=".85"/><rect x="108" y="268" width="184" height="114" fill="#F7B267" opacity=".55"/><circle cx="160" cy="320" r="22" fill="#FFD166"/>
<path d="M130 760c-30-90 20-150 60-170-10 60 10 100 30 120 0-70 40-130 90-140-30 60-20 120 0 170z" fill="#4E9F6B"/>
<path d="M210 720c10-80 60-120 110-120-40 40-50 90-50 140z" fill="#3E8A5A"/>
<path d="M150 760h170l-20 170H170z" fill="#E07A5F"/>
<path d="M330 1200c0-250 120-400 270-400s270 150 270 400z" fill="#2BB3C0"/>
<path d="M500 840c30 40 70 60 100 60s70-20 100-60" fill="none" stroke="#1F8F9A" stroke-width="14" stroke-linecap="round"/>
<rect x="560" y="580" width="80" height="110" rx="30" fill="#E8A87C"/>
<circle cx="600" cy="470" r="135" fill="#F1B98F"/>
<path d="M462 455c-10-120 70-185 150-180 100 5 150 70 140 175-25-55-60-85-110-95-40 40-110 60-180 100z" fill="#3B2A22"/>
<circle cx="458" cy="480" r="24" fill="#EBA77E"/><circle cx="742" cy="480" r="24" fill="#EBA77E"/>
<circle cx="555" cy="485" r="12" fill="#2A1E1A"/><circle cx="645" cy="485" r="12" fill="#2A1E1A"/>
<path d="M555 540c25 25 65 25 90 0" fill="none" stroke="#2A1E1A" stroke-width="9" stroke-linecap="round"/>
<circle cx="520" cy="530" r="18" fill="#F08A7A" opacity=".45"/><circle cx="680" cy="530" r="18" fill="#F08A7A" opacity=".45"/>
<rect width="1200" height="1200" fill="url(#l)"/></svg>`);

const KLEUREN = [
  {p:'#22205A',a:'#FFD166'},{p:'#0F5C55',a:'#FFB86B'},{p:'#5B3FD9',a:'#FFE066'},{p:'#C2412D',a:'#FFE3A3'},{p:'#14161F',a:'#38E1F5'}
];
const ONDERWERPEN = [
  {n:'Kennismaking', pill:'Gratis kennismaking', kop:['Zin','in','de','*volgende*','stap?'], desc:'Plan een vrijblijvend gesprek en ontdek wat we voor je kunnen doen.', cta:'Plan nu in'},
  {n:'Avondopening', sticker:'Nieuw!', kop:['Nu','ook','*\'s avonds*','open'], checks:['Elke werkdag tot 21:00','Ook op zaterdag'], cta:'Bekijk de tijden'},
  {n:'Vacature', sticker:'We zoeken jou!', kop:['Kom','bij','ons','*team*'], checks:['Fijne collega\'s','Ruimte om te groeien'], cta:'Solliciteer direct'}
];
let st = {kleur:0, eigenKleur:null, ow:0, stijl:'golf', fmt:'45', foto:SCENE, eigenFoto:false, aan:false};

function knoppen(el, lijst, sleutel, label){
  el.innerHTML = lijst.map((x,i)=>`<button class="keuze" data-i="${i}" type="button">${label(x)}</button>`).join('');
  el.querySelectorAll('.keuze').forEach(b=>b.onclick=()=>{ st[sleutel]=lijst[+b.dataset.i].v ?? +b.dataset.i; teken(true); });
}
function markeer(){
  document.querySelectorAll('#kleuren .kleur').forEach((k,i)=>k.classList.toggle('aan',st.eigenKleur==null && i===st.kleur));
  document.querySelectorAll('#onderwerpen .keuze').forEach((k,i)=>k.classList.toggle('aan',i===st.ow));
  document.querySelectorAll('#stijlen .keuze').forEach(k=>k.classList.toggle('aan',k.textContent.toLowerCase().startsWith(st.stijl)));
  document.querySelectorAll('#formaten .keuze').forEach(k=>k.classList.toggle('aan',k.dataset.v===st.fmt));
  $('#voorbeeld').classList.toggle('aan',!st.eigenFoto);
}
$('#kleuren').innerHTML = KLEUREN.map((k,i)=>`<div class="kleur" data-i="${i}" style="background:${k.p}" title="${k.p}"></div>`).join('')+'<label class="eigen" title="Eigen kleur"><input type="color" id="kiesKleur" value="#2E7D32"></label>';
document.querySelectorAll('#kleuren .kleur').forEach(k=>k.onclick=()=>{ st.kleur=+k.dataset.i; st.eigenKleur=null; teken(true); });
$('#kiesKleur').oninput = e=>{ st.eigenKleur=e.target.value; teken(true); };
knoppen($('#onderwerpen'), ONDERWERPEN, 'ow', x=>x.n);
$('#stijlen').innerHTML = '<button class="keuze" type="button" data-s="golf">Golf</button><button class="keuze" type="button" data-s="schuin">Schuine baan</button>';
$('#stijlen').querySelectorAll('.keuze').forEach(b=>b.onclick=()=>{ st.stijl=b.dataset.s; teken(true); });
$('#formaten').innerHTML = '<button class="keuze" type="button" data-v="45">4:5 feed</button><button class="keuze" type="button" data-v="916">9:16 story</button>';
$('#formaten').querySelectorAll('.keuze').forEach(b=>b.onclick=()=>{ st.fmt=b.dataset.v; teken(true); });

function kleur(){ if(st.eigenKleur) return {p:st.eigenKleur, a:helder(st.eigenKleur)>0.6?'#1B1A2E':'#FFD166'}; return KLEUREN[st.kleur]; }
function helder(hex){ const n=parseInt(hex.slice(1),16); const r=n>>16&255,g=n>>8&255,b=n&255; return (0.299*r+0.587*g+0.114*b)/255; }

/* maat en indeling per formaat (in pixels van het echte beeld) */
function indeling(){
  if(st.fmt==='45') return {w:1080,h:1350,fotoH:820,fotoPos:'center 25%',band:750,veilig:{x:60,y:60,w:960,h:1230},
    gezicht:{x:540-150,y:358-160,w:300,h:310}, logo:'left:70px;top:70px', kaart:false};
  return {w:1080,h:1920,fotoH:1020,fotoPos:'center 0%',band:960,veilig:{x:65,y:270,w:950,h:980},
    gezicht:{x:540-150,y:423-160,w:300,h:310}, logo:'left:65px;top:290px', kaart:true};
}

function teken(herstart){
  const L=indeling(), K=kleur(), O=ONDERWERPEN[st.ow], tekstKleur = helder(K.p)>0.6?'#1B1A2E':'#FFFFFF';
  const knopKleur = K.a, knopTekst = helder(K.a)>0.6?'#1B1A2E':'#FFFFFF';
  const ad=$('#ad'); ad.style.width=L.w+'px'; ad.style.height=L.h+'px'; ad.style.background=K.p;
  let scheiding;
  const b=L.band;
  if(L.kaart){
    scheiding = `<svg class="laag" viewBox="0 0 ${L.w} ${L.h}" style="height:${L.h}px"><rect x="0" y="${L.fotoH}" width="${L.w}" height="${L.h-L.fotoH}" fill="${K.p}"/></svg>`;
  } else if(st.stijl==='golf'){
    scheiding = `<svg class="laag" viewBox="0 0 ${L.w} ${L.h}" style="height:${L.h}px"><path d="M0 ${b+30} C 300 ${b-14}, 700 ${b+44}, 1080 ${b-18} L1080 ${L.h} L0 ${L.h} Z" fill="${K.a}"/><path d="M0 ${b+44} C 300 ${b}, 700 ${b+58}, 1080 ${b-4} L1080 ${L.h} L0 ${L.h} Z" fill="${K.p}"/></svg>`;
  } else {
    scheiding = `<svg class="laag" viewBox="0 0 ${L.w} ${L.h}" style="height:${L.h}px"><path d="M0 ${b-30} L1080 ${b+40} L1080 ${b+62} L0 ${b-8} Z" fill="${K.a}"/><path d="M0 ${b-8} L1080 ${b+62} L1080 ${L.h} L0 ${L.h} Z" fill="${K.p}"/></svg>`;
  }
  const pill = O.pill ? `<div class="pill" style="background:${K.a};color:${knopTekst};transition-delay:.45s">${O.pill}</div>` : '';
  let d=0; const stap=()=>`transition-delay:${(d+=0.12).toFixed(2)}s`;
  d=0.55;
  const kop = O.kop.map(w=>{ const acc=w.startsWith('*'); w=w.replace(/\*/g,''); return `<span style="${stap()};${acc?`color:${K.a}`:''}">${w}</span>`; }).join(' ');
  const lijnD = (d+=0.1).toFixed(2);
  const inhoud = O.checks ? O.checks.map(c=>`<div class="chip" style="${stap()}">${CHIPV(K.p)}<span>${c}</span></div>`).join('') : `<p class="desc" style="transition-delay:${(d+=0.15).toFixed(2)}s">${O.desc}</p>`;
  const ctaD=(d+=0.25).toFixed(2), logoD=(d+=0.2).toFixed(2);
  const blokStijl = L.kaart
    ? `left:65px;right:65px;bottom:${1920-1250}px;background:${K.p};border-radius:36px;border-top:8px solid ${K.a};padding:44px 48px 48px;box-shadow:0 18px 50px rgba(0,0,0,.35);transform:translateY(40px);opacity:0;transition:all .6s .15s`
    : `left:70px;right:70px;top:${b+(O.pill?70:90)}px`;
  const stickerHtml = O.sticker ? (L.kaart
      ? `<div class="sticker" style="right:40px;top:-40px;transition-delay:.5s"><span>${O.sticker}</span></div>`
      : `<div class="sticker" style="right:70px;top:${b-40}px;transition-delay:.7s"><span>${O.sticker}</span></div>`) : '';
  ad.innerHTML = `
    <div class="foto" style="height:${L.fotoH}px;background-image:url('${st.foto}');background-position:${L.fotoPos}"></div>
    ${scheiding}
    ${L.kaart?'':stickerHtml}
    <div class="blok" id="blok" style="${blokStijl};color:${tekstKleur}">
      ${L.kaart?stickerHtml:''}
      ${pill}
      <h1 class="kop" style="${pill?'':'margin-top:0'}">${kop}</h1>
      <div class="lijn" style="background:${K.a};transition-delay:${lijnD}s"></div>
      ${inhoud}
      <div><div class="cta" style="background:${knopKleur};color:${knopTekst};transition-delay:${ctaD}s">${O.cta}${PIJL(knopTekst)}</div></div>
    </div>
    <div class="logo" style="${L.logo};transition-delay:${logoD}s">${LOGO(K.p)}</div>
    <div class="veilig" style="left:${L.veilig.x}px;top:${L.veilig.y}px;width:${L.veilig.w}px;height:${L.veilig.h}px"></div>
    ${st.eigenFoto?'':`<div class="gezicht" style="left:${L.gezicht.x}px;top:${L.gezicht.y}px;width:${L.gezicht.w}px;height:${L.gezicht.h}px"></div>`}
    <div class="label-origineel">Originele foto</div>`;
  if(L.kaart){ const st2=document.createElement('style'); st2.textContent='.ad.aan #blok{transform:none!important;opacity:1!important}'; ad.appendChild(st2); }
  ad.classList.toggle('toon-vlak', $('#vlak').checked);
  schaal(); markeer(); zetChecks('wacht');
  ad.classList.remove('aan');
  if(st.aan && herstart){ requestAnimationFrame(()=>requestAnimationFrame(()=>speel())); }
}
function schaal(){
  const L=indeling(), pod=$('.podium'), ruimte = pod.clientWidth-56;
  const maxH = Math.max(420, Math.min(window.innerHeight-170, 900));
  const s = Math.min(ruimte/L.w, maxH/L.h);
  $('#ad').style.transform=`scale(${s})`; $('#passe').style.width=L.w*s+'px'; $('#passe').style.height=L.h*s+'px';
  $('#ad').dataset.s=s;
}
window.addEventListener('resize',schaal);

/* ---------- controle: echt gemeten op het beeld ---------- */
const CHECKS = [['vlak','Alle tekst en het logo vallen in het veilige vlak'],['font','Het lettertype is geladen'],['gezicht','Er staat niets over het gezicht'],['foto','De foto zelf is niet aangepast']];
function zetChecks(stand, uit){
  $('#checks').innerHTML = CHECKS.map(([k,t])=>{
    let c=''; if(stand==='klaar') c = uit[k]===true?'ok':uit[k]===false?'fout':'grijs';
    const tekst = (k==='gezicht' && st.eigenFoto) ? 'Gezicht vrij: de echte skill checkt dit met gezichtsherkenning' : t;
    return `<div class="check ${c}"><i>${c==='ok'?VINK:''}</i>${tekst}</div>`;
  }).join('');
  $('#uitslag').innerHTML = stand==='klaar' ? (Object.values(uit).includes(false) ? '<span style="color:#C2410C">Fouten gevonden: opnieuw maken</span>' : 'Fouten: <span style="color:var(--groen)">geen</span>') : '';
}
function rect(el,o){ const r=el.getBoundingClientRect(), s=+$('#ad').dataset.s; return {x:(r.left-o.left)/s, y:(r.top-o.top)/s, w:r.width/s, h:r.height/s}; }
function overlapt(a,b){ return !(a.x+a.w<=b.x || b.x+b.w<=a.x || a.y+a.h<=b.y || b.y+b.h<=a.y); }
async function controleer(){
  const L=indeling(), o=$('#ad').getBoundingClientRect();
  const delen=[...document.querySelectorAll('#ad .pill,#ad .sticker span,#ad h1.kop,#ad .chip,#ad .desc,#ad .cta,#ad .logo')].map(e=>rect(e,o));
  const v=L.veilig, marge=2;
  const inVlak = delen.every(r=>r.x>=v.x-marge && r.y>=v.y-marge && r.x+r.w<=v.x+v.w+marge && r.y+r.h<=v.y+v.h+marge);
  await document.fonts.ready;
  const font = document.fonts.check('800 40px Poppins');
  const gez = st.eigenFoto ? null : !delen.some(r=>overlapt(r,L.gezicht));
  const uit={vlak:inVlak,font,gezicht:gez,foto:true};
  const keys=Object.keys(uit); let stand={};
  for(let i=0;i<keys.length;i++){ await new Promise(r=>setTimeout(r,350)); stand[keys[i]]=uit[keys[i]]; zetChecksDeel(stand); }
  zetChecks('klaar',uit);
}
function zetChecksDeel(deel){ const alle={}; CHECKS.forEach(([k])=>alle[k]= k in deel ? deel[k] : 'wacht');
  $('#checks').innerHTML = CHECKS.map(([k,t])=>{ const w=alle[k]; const c=w===true?'ok':w===false?'fout':w===null?'grijs':''; const tekst=(k==='gezicht'&&st.eigenFoto)?'Gezicht vrij: de echte skill checkt dit met gezichtsherkenning':t; return `<div class="check ${c}"><i>${c==='ok'?VINK:''}</i>${tekst}</div>`; }).join(''); }

let speelRun=0;
function speel(){
  const mijn=++speelRun;
  $('#ad').classList.add('aan'); st.aan=true;
  $('#maak span').textContent='Nog een keer afspelen';
  $('#onder').textContent = 'De foto is precies hetzelfde gebleven. Alleen de laagjes erover zijn nieuw.';
  setTimeout(()=>{ if(mijn===speelRun) controleer(); }, 2600);
}
$('#maak').onclick = ()=>{
  if($('#ad').classList.contains('aan')){ $('#ad').classList.remove('aan'); zetChecks('wacht'); setTimeout(speel,700); }
  else speel();
};
$('#vlak').onchange = e=>$('#ad').classList.toggle('toon-vlak',e.target.checked);
$('#bestand').onchange = e=>{ const f=e.target.files[0]; if(!f) return; st.foto=URL.createObjectURL(f); st.eigenFoto=true; teken(true); };
$('#voorbeeld').onclick = ()=>{ st.foto=SCENE; st.eigenFoto=false; teken(true); };

document.fonts.ready.then(()=>teken(false));
teken(false);
</script>
<script>/*pv-close-msg*/addEventListener("keydown",e=>{if(e.key==="Escape")try{parent.postMessage("pv-close","*")}catch(_){}});</script>
</body>
</html>
