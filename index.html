<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:#F5F0E8;color:#1F1E1B;font-family:"Instrument Sans",system-ui,sans-serif;padding:24px}
.card{width:100%;max-width:420px;text-align:center;margin:0 auto}
.spark{display:block;width:44px;height:44px;color:#D97757;margin:0 auto 22px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#B4512F;background:#F3DDD1;border-radius:999px;padding:5px 11px}
h1{font-family:Newsreader,Georgia,serif;font-weight:300;font-size:clamp(38px,9vw,52px);line-height:1.02;letter-spacing:-.02em;margin:16px 0 12px}
h1 em{color:#B4512F}
p{color:#6B665E;line-height:1.55;margin-bottom:26px}
form{display:flex;gap:8px;background:#FFFCF7;border:1px solid #E6DED1;border-radius:20px;padding:8px;box-shadow:0 20px 40px -28px rgba(80,40,20,.45)}
input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;padding:10px 12px;color:#1F1E1B;outline:none}
button{border:0;background:#D97757;color:#fff;font:inherit;font-weight:500;border-radius:14px;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.6}
.err{min-height:22px;margin-top:12px;font-size:14px;color:#B4512F}
form.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
small{display:block;margin-top:26px;color:#9a9388;font-size:13px}
</style></head>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.i)},key,d(P.c));
  return new TextDecoder().decode(buf);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f=document.getElementById("f"), err=document.getElementById("err"), go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault(); const pw=document.getElementById("pw").value; if(!pw) return;
  go.disabled=true; go.textContent="…"; err.textContent="";
  try{ const html=await unlock(pw); try{ sessionStorage.setItem("lv-pw",pw); }catch(_){} show(html); }
  catch(_){ err.textContent="Dat wachtwoord klopt niet. Probeer het nog eens."; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); go.disabled=false; go.textContent="Open"; }
});
(async()=>{ let pw=null; try{ pw=sessionStorage.getItem("lv-pw"); }catch(_){} if(pw){ try{ show(await unlock(pw)); }catch(_){ try{ sessionStorage.removeItem("lv-pw"); }catch(__){} } } })();
</script>
